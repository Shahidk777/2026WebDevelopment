<!DOCTYPE html>
<!-- WD Lesson 1.2: How do we work with images on a web page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_images.asp
      https://www.w3schools.com/tags/tag_img.asp
-->

<html>
  <head>
    <title>Exploring Images</title>
  </head>
  <body>
    <!-- Example of an image from external source
        <img src="https://www.pinclipart.com/picdir/middle/199-1994265_7-duke-java-clipart.png">
    -->

    <!-- Challenge 1: Create an <h1> and put "External Source Images" -->
      <h1> External Source Images</h1>

    <!-- Challenge 2: Add an image of your choice by searching Google and getting the image address. -->
     <img src ="https://upload.wikimedia.org/wikipedia/en/a/a8/Mami_Tomoe.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original">

    <!-- Challenge 3: Add three more of the same image.  Change the width and height of each image to 
     be 200x200 for the first, 150x150 for the second and 100x100 for the third -->
     <img src = "https://upload.wikimedia.org/wikipedia/en/a/a8/Mami_Tomoe.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" height = "200" width = "200">
     <img src = "https://upload.wikimedia.org/wikipedia/en/a/a8/Mami_Tomoe.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" height = "150" width = "150">
     <img src = "https://upload.wikimedia.org/wikipedia/en/a/a8/Mami_Tomoe.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" height = "100" width = "100">

  <hr>
  <!-- Example of image from internal source, i.e your website 
    <img src="HulkLogo1.png">
  -->
  <!-- Challenge 4: Create an <h1> and put "Internal Source Images" -->
    <h1> Internal Source Images</h1>

  <!-- Challenge 5: Add the Hulk Logo 2 image located internally in the folder to the page -->
    <img src = "HulkLogo2.jpg">

  <hr>
  <!-- Example of image from an internal source stored within folder of your website 
    <img src="images/HulkSmash1.png">
  -->  

  <!-- Challenge 6: Create an <h1> and put "Internal Source Images Inside Folders" -->
    <h1> Internal Source Images Inside Folders </h1>

  <!-- Challenge 7: Add the Hulk Smash 2 and Hulk Smash 3 images. 
                   Both images are located in the images folder to the page -->
    <img src = "HulkSmash2.png"  width = "200" height = "200">
    <img src = "HulkSmash3.jpg"  width = "200" height = "200">

  <hr>
  <!-- Challenge Bonus: Create a heading with "Marvel Superheroes".  Add a horizontal rule.  
   Add five images of Marvel Superheroes.  Make them all the same size -->
   <h1> Marvel Superheroes </h1>
   <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlFQbFqpZJFJ-AJla9PPS4i_FOYyInV5YgvtXNhBY-fQ&s=10" width = "200" height = "200">
  <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnOA0DOo10pT8m7CBQGcn22VjIgORSC9LXiyI-9FtnsQ&s=10" width = "200" height = "200">  
  <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdMsD79duM9kVLbpCGMSLGQArlWpPG3JpXpVtQNaFXfg&s=10" width = "200" height = "200">
  <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmjndDW2KZpZ7lr_kt4BvPFJJl0VuwReDz8pc-WsmRsQ&s=10" width = "200" height = "200">
  <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMMFYdzRi_Ex60pFNqre3xdc8ZlZX-JKr70AYq1Lai9w&s=10" width = "200" height = "200">
  </body>
</html>
